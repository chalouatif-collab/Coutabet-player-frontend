<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coutabet - Premium Casino & Sports</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3132/3132634.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://ui.invisiblesport.com/bt-renderer.min.js"></script>

    <style>
        html, body { max-width: 100vw !important; overflow-x: hidden !important; position: relative; }
        @keyframes logo-3d-swing {
            0%, 100% { transform: perspective(800px) rotateY(-20deg) translateY(0); }
            50% { transform: perspective(800px) rotateY(20deg) translateY(-4px); }
        }
        .animated-logo-3d {
            animation: logo-3d-swing 5s ease-in-out infinite;
            filter: drop-shadow(0 8px 16px rgba(255,152,0,0.4));
            transform-style: preserve-3d; will-change: transform; object-fit: contain;
        }
        @keyframes float-dice { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .animate-bounce-slow { animation: float-dice 3s ease-in-out infinite; }
        @keyframes continuous-zoom { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        .auto-zoom-img { animation: continuous-zoom 6s ease-in-out infinite; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1a30; color: #94a3b8; }
        .bg-panel { background-color: #15243b; border: 1px solid #1a2a42; }
        .text-emerald { color: #ff9800; }
        .bg-emerald { background-color: #ff9800; color: #fff; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .player-view-section { display: none; }
        .player-view-section.block { display: block; }
    </style>
</head>

<body class="antialiased text-sm flex flex-col min-h-screen">
    <div>
        <!-- شاشة التحميل -->
        <div id="splash-screen" class="fixed inset-0 z-[9999] bg-[#0b1a30] flex flex-col items-center justify-center transition-opacity duration-700 ease-out">
            <div class="animated-logo-3d flex items-center gap-3 mb-6 select-none">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center shadow-[0_0_30px_rgba(255,152,0,0.6)] border border-orange-300">
                    <i class="fas fa-crown text-[#0b1a30] text-3xl"></i>
                </div>
                <div class="flex flex-col justify-center leading-none text-left">
                    <span class="text-white font-black text-3xl tracking-tight">COUTA<span class="text-orange-400">BET</span></span>
                    <span class="text-[10px] text-gray-400 font-extrabold uppercase tracking-widest mt-1">Premium Casino</span>
                </div>
            </div>
            <div class="flex items-center gap-2 text-orange-400 text-xs font-bold tracking-widest uppercase">
                <i class="fas fa-circle-notch fa-spin text-lg"></i> Chargement...
            </div>
        </div>

        <!-- الشريط العلوي -->
        <header class="bg-[#15243b] border-b border-[#1a2a42] sticky top-0 z-50">
            <div class="max-w-[1700px] mx-auto px-4 h-18 flex justify-between items-center py-3">
                <div class="flex items-center gap-6">
                    <div class="animated-logo-3d flex items-center gap-2 cursor-pointer select-none" onclick="switchSection('accueil')">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center shadow-[0_0_15px_rgba(255,152,0,0.5)] border border-orange-300">
                            <i class="fas fa-crown text-[#0b1a30] text-xl"></i>
                        </div>
                        <div class="flex flex-col justify-center leading-none">
                            <span class="text-white font-black text-xl tracking-tight">COUTA<span class="text-orange-400">BET</span></span>
                            <span class="text-[9px] text-gray-400 font-extrabold uppercase tracking-widest mt-0.5">Premium Casino</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div id="auth-buttons-container" class="flex items-center gap-2">
                        <button onclick="openLoginModal()" class="bg-[#0b1a30] hover:bg-orange-500 text-orange-400 hover:text-white font-extrabold text-xs uppercase px-4 py-2 rounded-lg border border-orange-500/50 transition-all">Connexion</button>
                    </div>

                    <button id="top-recharge-btn" onclick="toggleCashier()" class="hidden bg-orange-500 hover:bg-orange-400 text-white font-extrabold text-xs uppercase px-4 py-2 rounded-lg shadow-md transition-all items-center gap-2">
                        <i class="fas fa-plus"></i> <span>Dépôt</span>
                    </button>

                    <div id="top-user-profile" class="hidden items-center gap-3 cursor-pointer group shrink-0" onclick="toggleProfileSidebar()">
                        <div class="relative w-10 h-10 rounded-full flex items-center justify-center p-[2px] bg-conic">
                            <div class="w-full h-full bg-[#0b1a30] rounded-full flex items-center justify-center text-yellow-500 text-sm border-2 border-[#15243b]">
                                <i class="fas fa-user-astronaut"></i>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-mono text-white text-xs leading-none font-bold">
                                <span id="player-balance-val">0.00</span> <span class="text-orange-400 text-[9px]">TND</span>
                            </div>
                        </div>
                    </div>

                    <div id="top-notification-bell" class="hidden relative cursor-pointer items-center justify-center w-8 h-8 rounded-full bg-[#0b1a30] border border-[#1a2a42] hover:border-orange-500 transition" onclick="toggleNotificationsPanel()">
                        <i class="fas fa-bell text-gray-400 text-xs"></i>
                        <span id="notif-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-bold px-1 py-0.5 rounded-full hidden">0</span>
                    </div>

                    <div id="notifications-panel" class="absolute top-14 right-4 w-80 bg-[#15243b] border border-[#1a2a42] rounded-2xl shadow-2xl hidden flex-col z-[100] overflow-hidden">
                        <div class="p-3 border-b border-[#1a2a42] bg-[#0b1a30] flex justify-between items-center text-white font-bold text-sm">Notifications 🔔</div>
                        <div id="notifs-list" class="max-h-[300px] overflow-y-auto p-2 flex flex-col gap-1"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- شريط التصنيفات (تمت إزالة Betconstruct و SABA) -->
        <div class="bg-[#0b1a30] border-b border-[#1a2a42] py-3">
            <div class="max-w-[1700px] mx-auto px-4 flex gap-3 overflow-x-auto drag-scroll text-[13px] font-extrabold hide-scroll pb-1">
                <button id="btn-nav-accueil" onclick="setActiveMenuBtn('btn-nav-accueil'); switchSection('accueil')" class="main-nav-btn bg-orange-500 text-white px-5 py-2 rounded-xl flex items-center gap-2 flex-shrink-0">
                    <i class="fas fa-home"></i> Accueil
                </button>
                <button id="btn-nav-sport" onclick="setActiveMenuBtn('btn-nav-sport'); openSportsbookForProvider('nexus')" class="main-nav-btn bg-[#15243b] text-white border border-[#1a2a42] px-5 py-2 rounded-xl flex items-center gap-2 flex-shrink-0">
                    <i class="fas fa-futbol text-orange-400"></i> Sport
                </button>
                <button id="btn-nav-casino" onclick="setActiveMenuBtn('btn-nav-casino'); switchSection('casino'); initCasinoLobby();" class="main-nav-btn bg-[#15243b] text-white border border-[#1a2a42] px-5 py-2 rounded-xl flex items-center gap-2 flex-shrink-0">
                    <i class="fas fa-slot-machine text-yellow-500"></i> Casino
                </button>
                <button id="btn-nav-live" onclick="setActiveMenuBtn('btn-nav-live'); switchSection('live-casino'); openLiveCasino();" class="main-nav-btn bg-[#15243b] text-white border border-[#1a2a42] px-5 py-2 rounded-xl flex items-center gap-2 flex-shrink-0">
                    <i class="fas fa-video text-red-500"></i> Casino Live
                </button>
                <button id="btn-nav-virtuals" onclick="setActiveMenuBtn('btn-nav-virtuals'); switchSection('virtuals'); initVirtualsLobby();" class="main-nav-btn bg-[#15243b] text-white border border-[#1a2a42] px-5 py-2 rounded-xl flex items-center gap-2 flex-shrink-0">
                    <i class="fas fa-gamepad text-blue-400"></i> Virtuels
                </button>
            </div>
        </div>
    </div>

    <main class="max-w-[1700px] mx-auto px-4 py-6 w-full flex-grow flex gap-6">
        <div class="w-full flex-1 space-y-6">
            <!-- PANE: ACCUEIL -->
            <div id="pane-accueil" class="player-view-section block space-y-6 w-full">
                <div class="relative w-full h-[280px] my-4">
                    <img src="https://i.postimg.cc/tTKz01dj/banner.png" alt="Banner 3D" class="block absolute right-10 bottom-0 h-[125%] max-w-[350px] object-contain z-[60] pointer-events-none">
                    <div class="relative w-full h-full rounded-2xl overflow-hidden bg-[#15243b] border border-orange-500/30 shadow-xl">
                        <div id="hero-slider" class="w-full h-full relative">
                            <div class="slide-item absolute inset-0 transition-opacity duration-1000 opacity-100 z-20">
                                <div class="absolute inset-0 bg-gradient-to-r from-[#0b1a30] via-[#15243b]/95 to-orange-500/30"></div>
                                <div class="relative h-full flex flex-col justify-center px-12 w-[60%] z-20">
                                    <h2 class="text-white text-4xl font-black uppercase tracking-wide mb-2">L'Expérience <span class="text-orange-400">Coutabet</span></h2>
                                    <p class="text-gray-400 text-sm font-semibold mb-4">Plongez dans un univers de divertissement sans limite.</p>
                                    <button onclick="switchSection('casino'); initCasinoLobby();" class="w-fit bg-orange-500 text-white font-black text-xs uppercase px-5 py-2.5 rounded-full shadow-lg">Jouer</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- شبكة التصنيفات السريعة -->
                <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                    <button onclick="switchSection('casino'); initCasinoLobby();" class="bg-[#15243b] border border-[#1a2a42] hover:border-orange-500 rounded-xl p-3 flex flex-col items-center justify-center text-center">
                        <img src="https://img.icons8.com/3d-fluency/250/slot-machine.png" class="h-10 mb-2 animate-bounce-slow">
                        <span class="text-white font-black text-xs">Slots</span>
                    </button>
                    <button onclick="switchSection('live-casino'); openLiveCasino();" class="bg-[#15243b] border border-[#1a2a42] hover:border-red-500 rounded-xl p-3 flex flex-col items-center justify-center text-center">
                        <img src="https://img.icons8.com/3d-fluency/250/roulette.png" class="h-10 mb-2 animate-bounce-slow">
                        <span class="text-white font-black text-xs">Live Casino</span>
                    </button>
                    <button onclick="switchSection('virtuals'); initVirtualsLobby();" class="bg-[#15243b] border border-[#1a2a42] hover:border-blue-500 rounded-xl p-3 flex flex-col items-center justify-center text-center">
                        <img src="https://img.icons8.com/3d-fluency/250/controller.png" class="h-10 mb-2 animate-bounce-slow">
                        <span class="text-white font-black text-xs">Virtuels</span>
                    </button>
                </div>

                <div id="dynamic-featured-providers" class="flex flex-col gap-6 mb-8 w-full mt-4"></div>
            </div>

            <!-- PANE: CASINO -->
            <div id="pane-casino" class="player-view-section hidden w-full">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-slot-machine text-2xl text-orange-400"></i>
                    <h2 class="text-white font-extrabold text-xl">Casino & Slots</h2>
                </div>
                <div class="flex gap-3 mb-6 relative z-[100]">
                    <input type="text" id="game-search-input" onkeyup="filterGames()" placeholder="Rechercher un jeu..." class="w-full bg-[#15243b] border border-[#1a2a42] rounded-xl py-3 px-4 text-white text-sm outline-none focus:border-orange-500 font-bold">
                </div>
                <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 xl:grid-cols-6 gap-3 pb-10"></div>
            </div>

            <!-- PANE: LIVE CASINO -->
            <div id="pane-live-casino" class="player-view-section hidden w-full">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-video text-xl text-red-500"></i>
                    <h2 class="text-white font-bold text-lg">Live Casino</h2>
                </div>
                <div id="live-games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 xl:grid-cols-6 gap-3 pb-10"></div>
            </div>

            <!-- PANE: VIRTUALS -->
            <div id="pane-virtuals" class="player-view-section hidden w-full">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-gamepad text-xl text-blue-400"></i>
                    <h2 class="text-white font-bold text-lg">Jeux Virtuels</h2>
                </div>
                <div id="virtuals-games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 pb-10"></div>
            </div>
        </div>
    </main>

    <!-- CASINO IFRAME -->
    <div id="casino-iframe-container" class="fixed inset-0 z-[600] bg-[#0b1a30] hidden flex-col">
        <div class="h-12 bg-[#15243b] border-b border-[#1a2a42] flex justify-between items-center px-4">
            <span class="text-white font-black text-xs uppercase">COUTA<span class="text-orange-400">BET</span></span>
            <button onclick="closeCasinoGame()" class="text-red-500 font-bold px-3 py-1 bg-red-500/10 rounded-lg">Fermer ✕</button>
        </div>
        <iframe id="casino-iframe" class="w-full flex-grow border-0"></iframe>
    </div>

    <!-- CAISSIER MODAL -->
    <div id="cashier-modal" class="fixed inset-0 z-[400] hidden bg-black/80 backdrop-blur-md items-center justify-center p-4">
        <div class="bg-[#15243b] border border-[#1a2a42] rounded-3xl w-full max-w-md p-6 relative">
            <button onclick="toggleCashier()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl">&times;</button>
            <h2 class="text-xl font-bold text-white mb-6">Caisse</h2>
            <div class="space-y-4">
                <input type="text" id="usdt-code" placeholder="ID de transaction / Code" class="w-full bg-[#0b1a30] border border-[#1a2a42] rounded-lg p-3 text-white text-sm">
                <button onclick="submitDeposit('usdt')" class="w-full bg-orange-500 text-white font-bold p-3 rounded-xl">Confirmer le dépôt</button>
            </div>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="player-login-modal" class="fixed inset-0 z-[200] bg-black/80 hidden items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#15243b] border border-orange-500/50 rounded-2xl p-8 relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <h2 class="text-white text-2xl font-bold mb-6 text-center">Connexion</h2>
            <input type="text" id="p-auth-username" placeholder="Nom d'utilisateur" class="w-full mb-3 p-3 rounded-xl bg-[#0b1a30] border border-[#1a2a42] text-white">
            <input type="password" id="p-auth-password" placeholder="Mot de passe" class="w-full mb-4 p-3 rounded-xl bg-[#0b1a30] border border-[#1a2a42] text-white">
            <button onclick="handlePlayerAuth()" class="w-full bg-orange-500 text-white font-bold p-3 rounded-xl">Entrer</button>
        </div>
    </div>

    <!-- PROFILE SIDEBAR -->
    <div id="profile-overlay" onclick="toggleProfileSidebar()" class="fixed inset-0 bg-black/60 z-[190] hidden"></div>
    <div id="profile-sidebar" class="fixed right-0 top-0 bottom-0 w-80 bg-[#15243b] border-l border-[#1a2a42] z-[200] shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-5 border-b border-[#1a2a42] flex justify-between items-center bg-[#0b1a30]">
            <span class="text-white font-bold" id="sidebar-username">Joueur</span>
            <button onclick="toggleProfileSidebar()" class="text-gray-400">✕</button>
        </div>
        <div class="p-4 mt-auto">
            <button onclick="logoutPlayer()" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg">Déconnexion</button>
        </div>
    </div>

    <!-- سكريبتات التشغيل والدوال الأصلية المتصلة بالباك إند المركزي -->
    <script>
        const BACKEND_URL = "https://alpha-backend-server.onrender.com";
        let playerSession = null;

        function escapeHTML(str) { return str ? str.toString().replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : ''; }
        function openLoginModal() { document.getElementById('player-login-modal').classList.remove('hidden'); document.getElementById('player-login-modal').classList.add('flex'); }
        function closeLoginModal() { document.getElementById('player-login-modal').classList.add('hidden'); document.getElementById('player-login-modal').classList.remove('flex'); }
        function toggleProfileSidebar() { document.getElementById('profile-sidebar').classList.toggle('translate-x-full'); document.getElementById('profile-overlay').classList.toggle('hidden'); }
        function toggleCashier() { if (!playerSession) return openLoginModal(); document.getElementById('cashier-modal').classList.toggle('hidden'); document.getElementById('cashier-modal').classList.toggle('flex'); }

        function showNotification(message, type = "success") {
            const toast = document.createElement('div');
            toast.className = `fixed top-5 right-5 z-[9999] px-4 py-3 rounded-xl text-white font-bold text-xs shadow-xl ${type === 'error' ? 'bg-red-600' : 'bg-orange-500'}`;
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.onload = () => {
            const splash = document.getElementById('splash-screen');
            if (splash) setTimeout(() => splash.style.display = 'none', 700);
            const savedSession = localStorage.getItem('alpha_player_session');
            if (savedSession) { playerSession = JSON.parse(savedSession); setupLoggedInUI(); }
            switchSection('accueil');
            startLiveJackpots();
            loadFeaturedProvidersBlocks();
        };

        function switchSection(sectionId) {
            document.querySelectorAll('.player-view-section').forEach(el => el.classList.add('hidden'));
            const panel = document.getElementById(`pane-${sectionId}`);
            if (panel) panel.classList.remove('hidden');
            if (sectionId === 'casino') initCasinoLobby();
            else if (sectionId === 'live-casino') openLiveCasino();
            else if (sectionId === 'virtuals') initVirtualsLobby();
        }

        async function handlePlayerAuth() {
            const username = document.getElementById('p-auth-username').value.trim();
            const password = document.getElementById('p-auth-password').value;
            if (!username || !password) return;
            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    playerSession = data;
                    localStorage.setItem('alpha_player_session', JSON.stringify(data));
                    localStorage.setItem('token', data.access_token);
                    setupLoggedInUI();
                    showNotification("Bienvenue !");
                } else showNotification(data.detail, 'error');
            } catch (e) { showNotification("Erreur serveur", 'error'); }
        }

        function setupLoggedInUI() {
            closeLoginModal();
            document.getElementById('auth-buttons-container').classList.add('hidden');
            document.getElementById('top-user-profile').classList.remove('hidden');
            document.getElementById('top-user-profile').classList.add('flex');
            document.getElementById('top-recharge-btn').classList.remove('hidden');
            document.getElementById('top-recharge-btn').classList.add('flex');
            document.getElementById('sidebar-username').innerText = playerSession.username;
            refreshBalance();
            setInterval(refreshBalance, 5000);
        }

        async function refreshBalance() {
            if (!playerSession) return;
            try {
                const res = await fetch(`${BACKEND_URL}/gold_api`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ method: 'user_balance', user_code: playerSession.username })
                });
                const data = await res.json();
                if (data.user_balance !== undefined) {
                    document.getElementById('player-balance-val').innerText = parseFloat(data.user_balance).toFixed(2);
                }
            } catch (e) { }
        }

        function logoutPlayer() { localStorage.clear(); location.reload(); }
        function getAuthHeaders() { return { 'Authorization': `Bearer ${localStorage.getItem('token')}`, 'Content-Type': 'application/json' }; }

        window.nexusProviders = [
            { code: 'PRAGMATIC', name: 'Pragmatic' }, { code: 'HACKSAW', name: 'Hacksaw' }, { code: 'SPRIBE', name: 'Spribe' }
        ];

        async function initCasinoLobby() { loadProviderGames('PRAGMATIC', 'Pragmatic'); }

        async function loadProviderGames(providerCode, providerName) {
            const grid = document.getElementById('games-grid');
            if (grid) grid.innerHTML = '<div class="col-span-full text-orange-400 text-center py-10 animate-pulse font-bold">Chargement...</div>';
            try {
                const res = await fetch(`${BACKEND_URL}/api/get-providers`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider_code: providerCode })
                });
                const data = await res.json();
                let gamesList = data.games || data.data || data || [];
                window.currentProviderGames = gamesList;
                renderCasinoGrid(gamesList, providerCode);
            } catch (e) {
                if (grid) grid.innerHTML = '<div class="col-span-full text-red-500 text-center py-10">Erreur de connexion</div>';
            }
        }

        function renderCasinoGrid(games, providerCode) {
            const container = document.getElementById('games-grid');
            if (!container) return;
            container.innerHTML = games.map(g => {
                const title = escapeHTML(g.game_name || g.name || "Game");
                const img = g.banner || g.image || `https://placehold.co/400x400/15243b/ff9800?text=${encodeURIComponent(title.substring(0, 10))}`;
                const code = g.game_code || g.id;
                return `
                <div onclick="playCasinoGame('${providerCode}', '${code}')" class="bg-[#0b1a30] border border-[#1a2a42] rounded-xl overflow-hidden cursor-pointer hover:border-orange-500 transition-all flex flex-col group shadow-lg">
                    <div class="relative w-full aspect-square overflow-hidden bg-[#15243b]">
                        <img src="${img}" class="w-full h-full object-cover auto-zoom-img">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <span class="bg-orange-500 text-white text-[10px] font-bold px-4 py-2 rounded-full">JOUER</span>
                        </div>
                    </div>
                    <div class="p-2 text-[10px] text-white font-bold truncate text-center">${title}</div>
                </div>`;
            }).join('');
        }

        async function playCasinoGame(providerCode, gameCode) {
            if (!playerSession) return openLoginModal();
            try {
                const res = await fetch(`${BACKEND_URL}/api/provider/launch-casino`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ game_code: gameCode, provider_code: providerCode, user_code: playerSession.username })
                });
                const data = await res.json();
                if (data.launch_url) {
                    const container = document.getElementById('casino-iframe-container');
                    const iframe = document.getElementById('casino-iframe');
                    container.classList.remove('hidden'); container.classList.add('flex');
                    iframe.src = data.launch_url;
                } else { showNotification("Jeu non disponible", "error"); }
            } catch (e) { showNotification("Erreur", "error"); }
        }

            document.getElementById('casino-iframe-container').classList.add('hidden');
            document.getElementById('casino-iframe-container').classList.remove('flex');
